name: PlantCare AI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-and-data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m py_compile app.py plantcare_core.py
      - run: pytest -q
