name: Real-photo benchmark for 56 plant classes

on:
  push:
    branches:
      - "benchmark-run/**"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference dependencies
        run: python -m pip install numpy==1.26.4 Pillow==11.3.0 requests==2.32.5 torch==2.5.1 torchvision==0.20.1 open_clip_torch==2.31.0
      - name: Benchmark real photos for all supported species
        run: python benchmark_56.py --per-class 1 --device cpu --output benchmark_results.csv
      - name: Save predictions and per-class metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantcare-56-real-photo-benchmark
          path: benchmark_results.csv
          if-no-files-found: warn
          retention-days: 14
